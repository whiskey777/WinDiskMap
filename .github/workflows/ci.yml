name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + smoke test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (net8.0 + net48)
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke test (CSV, directory walk)
        shell: pwsh
        run: |
          $exe = (Resolve-Path './src/WinDiskMap/bin/Release/net48/WinDiskMap.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'wdm-smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -LiteralPath (Join-Path $dir 'sample.txt') -Value 'WinDiskMap CI smoke test'
          $csv = Join-Path $env:RUNNER_TEMP 'wdm-smoke.csv'
          & $exe $dir --csv $csv --no-mft --headless
          if ($LASTEXITCODE -ne 0) { throw "scan failed with exit code $LASTEXITCODE" }
          $first = Get-Content -LiteralPath $csv -TotalCount 1
          if ($first -notmatch '^File name,Size,On disk,') { throw "unexpected CSV header: $first" }
          "CSV header OK: $first"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check new dependencies for known vulnerabilities
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

